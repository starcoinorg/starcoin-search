apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-api-deployment
  namespace: starcoin-api
  labels:
    app: scan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-api
  template:
    metadata:
      labels:
        app: scan-api
    spec:
      containers:
        - name: scan-api
          image: starcoin/starcoin_scan:scan_api_dag_2
          resources:
            requests:
              memory: 768Mi
          ports:
            - name: http
              containerPort: 8500
            - name: multicast
              containerPort: 5701
          # Keep the old pod serving during a rollout until the new one listens.
          readinessProbe:
            tcpSocket:
              port: 8500
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          env:
            - name: STARCOIN_ES_URL
              value: "elasticsearch.default.svc.cluster.local"
            - name: STARCOIN_ES_PROTOCOL
              value: "http"
            - name: STARCOIN_ES_PORT
              value: "9200"
            - name: STARCOIN_ES_USER
              valueFrom:
                secretKeyRef:
                  name: elasticsearch
                  key: username
            - name: STARCOIN_ES_PWD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch
                  key: password
            - name: STARCOIN_ES_INDEX_VERSION
              value: ".0727"
            - name: DS_URL
              value: "jdbc:postgresql://private-db-postgresql-sgp1-29237-do-user-13054015-0.h.db.ondigitalocean.com:25060/starcoin"
            - name: DB_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: username
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
            # Maybe useless variables
            - name: MAIN_DS_URL
              value: "jdbc:postgresql://private-db-postgresql-sgp1-29237-do-user-13054015-0.h.db.ondigitalocean.com:25060/starcoin?currentSchema=main"
            - name: BARNARD_DS_URL
              value: "jdbc:postgresql://private-db-postgresql-sgp1-29237-do-user-13054015-0.h.db.ondigitalocean.com:25060/starcoin?currentSchema=barnard"
            - name: HALLEY_DS_URL
              value: "jdbc:postgresql://private-db-postgresql-sgp1-29237-do-user-13054015-0.h.db.ondigitalocean.com:25060/starcoin?currentSchema=halley"
            - name: STARCOIN_USER_DS_URL
              value: "jdbc:postgresql://private-db-postgresql-sgp1-29237-do-user-13054015-0.h.db.ondigitalocean.com:25060/starcoin?currentSchema=starcoin_user"
            # Each datasource is a HikariDataSource bound from spring.datasource.<name>.
            # The Hikari default (10 connections, all held idle) cost 40 Postgres
            # connections. Barnard and halley do not run, but their beans must start.
            - name: SPRING_DATASOURCE_MAIN_MAXIMUMPOOLSIZE
              value: "10"
            - name: SPRING_DATASOURCE_MAIN_MINIMUMIDLE
              value: "2"
            - name: SPRING_DATASOURCE_USERINFO_MAXIMUMPOOLSIZE
              value: "4"
            - name: SPRING_DATASOURCE_USERINFO_MINIMUMIDLE
              value: "1"
            - name: SPRING_DATASOURCE_BARNARD_MAXIMUMPOOLSIZE
              value: "2"
            - name: SPRING_DATASOURCE_BARNARD_MINIMUMIDLE
              value: "0"
            - name: SPRING_DATASOURCE_HALLEY_MAXIMUMPOOLSIZE
              value: "2"
            - name: SPRING_DATASOURCE_HALLEY_MINIMUMIDLE
              value: "0"

