apiVersion: v1
kind: Service
metadata:
  labels:
    app: scan-api
  name: scan-api
  namespace: starcoin-api
spec:
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 8500
  selector:
    app: scan-api
  # Public traffic arrives through the shared web-entry load balancer
  # (stcscan.io, api.stcscan.io, doapi.stcscan.io).
  type: ClusterIP
